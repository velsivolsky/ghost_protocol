        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050609;
            --glow-cyan: #00d9ff;
            --glow-green: #39ff14;
            --glow-purple: #a500ff;
            --glow-red: #ff006e;
            --text-primary: #00d9ff;
            --text-secondary: #39ff14;
            --text-danger: #ff006e;
            --terminal-bg: rgba(10, 14, 39, 0.95);
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            overflow: hidden;
        }

        .glow-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(165, 0, 255, 0.03) 0%, transparent 50%);
            animation: glowShift 8s ease-in-out infinite;
            filter: blur(80px);
        }

        @keyframes glowShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
            animation: scanlineFlicker 0.15s infinite;
        }

        @keyframes scanlineFlicker {
            0%, 100% { opacity: 0.03; }
            50% { opacity: 0.08; }
        }

        .flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.02);
            pointer-events: none;
            z-index: 99;
            animation: flicker 0.15s infinite;
        }

            0% { opacity: 0.97; }
            5% { opacity: 0.98; }
            10% { opacity: 0.96; }
            15% { opacity: 0.99; }
            20% { opacity: 0.97; }
            25% { opacity: 0.98; }
            30% { opacity: 0.96; }
            35% { opacity: 0.97; }
            40% { opacity: 0.99; }
            45% { opacity: 0.98; }
            50% { opacity: 0.97; }
            55% { opacity: 0.96; }
            60% { opacity: 0.99; }
            65% { opacity: 0.97; }
            70% { opacity: 0.98; }
            75% { opacity: 0.96; }
            80% { opacity: 0.99; }
            85% { opacity: 0.97; }
            90% { opacity: 0.98; }
            95% { opacity: 0.96; }
            100% { opacity: 0.97; }

            position: relative;
            z-index: 50;
            width: 95%;
            max-width: 900px;
            height: 85vh;
            background: var(--terminal-bg);
            border: 2px solid var(--glow-cyan);
            border-radius: 8px;
            box-shadow: 
                0 0 20px rgba(0, 217, 255, 0.3),
                0 0 40px rgba(165, 0, 255, 0.15),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);

            justify-content: space-between;

            color: var(--text-danger);

            background: rgba(0, 217, 255, 0.02);

            init() {
                this.input.addEventListener('keydown', (e) => this.handleKeydown(e));

            async startBootSequence() {

                for (const line of bootLines) {

                    if (line.text) {
                        this.addLine(line.text, line.type || 'system');
                    } else {

                        if (this.state.confirmationCallback) {

                        }

                }

                if (e.key === 'Enter') {
                    e.preventDefault();
                    const command = this.input.value.trim();
                    this.executeCommand(command);
                    this.history.push(command);
                    this.historyIndex = this.history.length;
                    this.input.value = '';
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (this.historyIndex > 0) {
                        this.historyIndex--;
                        this.input.value = this.history[this.historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (this.historyIndex < this.history.length - 1) {
                        this.historyIndex++;
                        this.input.value = this.history[this.historyIndex];
                    } else if (this.historyIndex === this.history.length - 1) {
                        this.historyIndex++;
                        this.input.value = '';
                    }
                }
            },

            normalizePath(inputPath) {
                let path = inputPath.trim();
                
                if (!path.startsWith('/')) {
                    if (path === '.') {
                        return this.state.currentPath;
                    } else if (path === '..') {
                        const parts = this.state.currentPath.split('/').filter(p => p);
                        if (parts.length > 0) {
                            return '/' + parts.slice(0, -1).join('/');
                        }
                        return '/root';
                    } else {
                        path = this.state.currentPath + '/' + path;
                    }
                }
                
                path = path.replace(/\/+/g, '/');
                if (path !== '/root' && path !== '/') {
                    path = path.replace(/\/$/, '');
                }
                
                return path;
            },

            listDirectory(pathInput = null) {
                const path = pathInput ? this.normalizePath(pathInput) : this.state.currentPath;
                
                if (!this.dirs[path]) {
                    this.addLine(`ls: cannot access '${pathInput}': No such file or directory`, 'error');
                    return;
                }
                
                const dir = this.dirs[path];
                if (dir.type !== 'dir') {
                    this.addLine(`ls: '${pathInput}' is not a directory`, 'error');
                    return;
                }
                
                this.addLine('');
                const items = dir.contents;
                
                // Separate hidden and normal files
                const hiddenItems = items.filter(item => item.startsWith('.'));
                const visibleItems = items.filter(item => !item.startsWith('.'));
                
                // Show visible files first
                for (const item of visibleItems) {
                    const itemPath = path === '/root' ? `/root/${item}` : `${path}/${item}`;
                    const isDir = this.dirs[itemPath] && this.dirs[itemPath].type === 'dir';
                    const marker = isDir ? '/' : '';
                    const display = item + marker;
                    
                    if (isDir) {
                        this.addLine(`  ${display}`, 'success');
                    } else {
                        this.addLine(`  ${display}`, 'info');
                    }
                }
                
                // Show hidden files if any exist
                if (hiddenItems.length > 0) {
                    this.addLine('  (hidden files detected)', 'warn');
                    for (const item of hiddenItems) {
                        const itemPath = path === '/root' ? `/root/${item}` : `${path}/${item}`;
                        const isDir = this.dirs[itemPath] && this.dirs[itemPath].type === 'dir';
                        const marker = isDir ? '/' : '';
                        const display = item + marker;
                        
                        if (isDir) {
                            this.addLine(`  ${display}`, 'success');
                        } else {
                            this.addLine(`  ${display}`, 'warn');
                        }
                    }
                }
                
                this.addLine('');
            },

            changeDirectory(pathInput) {
                if (!pathInput || pathInput.trim() === '') {
                    this.addLine('cd: missing argument', 'error');
                    return;
                }
                
                const path = this.normalizePath(pathInput);
                
                if (!this.dirs[path]) {
                    this.addLine(`cd: '${pathInput}': No such file or directory`, 'error');
                    return;
                }
                
                const dir = this.dirs[path];
                if (dir.type !== 'dir') {
                    this.addLine(`cd: '${pathInput}': Not a directory`, 'error');
                    return;
                }
                
                this.state.currentPath = path;
                this.updatePrompt();
            },

            updatePrompt() {
                this.prompt.textContent = `${this.state.currentUser || 'root'}@nexus:${this.state.currentPath} $`;
            },

            async readFile(fileInput) {
                if (!fileInput || fileInput.trim() === '') {
                    this.addLine('cat: missing argument', 'error');
                    return;
                }
                
                const filePath = this.normalizePath(fileInput);
                
                if (!this.files[filePath]) {
                    this.addLine(`cat: ${fileInput}: No such file or directory`, 'error');
                    return;
                }
                
                this.addLine('');
                const content = this.files[filePath];
                const lines = content.split('\n');
                
                for (const line of lines) {
                    await this.sleep(30);
                    this.addLine(line, 'info');
                }
                
                this.addLine('');
            },

            showHelp() {
                const help = `
═══════════════════════════════════════════════════════════
  NEXUS NODE RECOVERY TERMINAL - COMMAND REFERENCE
═══════════════════════════════════════════════════════════

NAVIGATION:
  ls [dir]           - List directory contents
  cd <dir>           - Change directory
  pwd                - Show current directory

FILE OPERATIONS:
  cat <file>         - Display file contents
  open <file>        - Alias for cat
  list               - List recovered files (legacy)

SYSTEM:
  login              - Initiate login sequence
  whoami             - Show current user
  status             - Show system status
  clear              - Clear terminal screen
  help               - Show this message

NAVIGATION EXAMPLES:
  cd recovered       - Enter recovered directory
  cd logs            - Enter logs subdirectory
  cd /root           - Return to root directory
  cd ..              - Go to parent directory

EXPLORATION:
  Read files carefully. Clues are everywhere.
  Some files are hidden (. prefix).
  Some are Easter eggs.

═══════════════════════════════════════════════════════════`;
                this.addLine(help, 'info');
            },

            listFiles() {
                const list = `
RECOVERED FILES:

  memo.txt              [TEXT]
  auth.log              [LOG]
  sectors.map           [MAP]
  node-status.log       [STATUS]
  recovered/logs/       [DIR]
  recovered/data/       [DIR]
`;
                this.addLine(list.trim(), 'info');
            },

            async initiateLogin() {
                this.addLine('');
                this.addLine('Initiating login sequence...', 'warn');
                await this.sleep(300);
                
                this.state.waitingForLogin = true;
                this.addLine('LOGIN: ', 'system');
                this.input.placeholder = '';
                this.prompt.textContent = '';
                this.input.focus();
            },

            async processLogin(user) {
                this.addLine(user, 'info');
                
                if (user !== 'ghost') {
                    this.addLine('');
                    this.addLine('ACCESS DENIED', 'error');
                    this.addLine('Invalid credentials', 'error');
                    await this.sleep(500);
                    this.resetLogin();
                    return;
                }

                this.state.currentUser = user;
                this.state.waitingForLogin = false;
                this.state.waitingForPassword = true;
                
                await this.sleep(200);
                this.addLine('PASSWORD: ', 'system');
                this.input.focus();
            },

            async processPassword(password) {
                this.addLine('●●●●●●●●●●', 'info');
                
                if (password !== 'blackout') {
                    this.addLine('');
                    this.addLine('ACCESS DENIED', 'error');
                    this.addLine('Invalid credentials', 'error');
                    await this.sleep(500);
                    this.resetLogin();
                    return;
                }

                this.state.waitingForPassword = false;
                
                await this.sleep(300);
                this.addLine('');
                this.addLine('Verifying credentials...', 'warn');
                await this.sleep(400);
                
                this.addLine('Decrypting session data...', 'warn');
                for (let i = 0; i < 3; i++) {
                    await this.sleep(150);
                    this.addLine('█░░░░░░░░░░░░░░░░░░ 5%', 'warn');
                    await this.sleep(150);
                    this.addLine('███████░░░░░░░░░░░░ 35%', 'warn');
                    await this.sleep(150);
                    this.addLine('███████████████░░░░░ 80%', 'warn');
                    await this.sleep(150);
                    this.addLine('████████████████████ 100%', 'success');
                }
                
                await this.sleep(600);
                this.addLine('');
                this.addLine('ACCESS GRANTED', 'success');
                
                await this.sleep(400);
                this.addLine('');
                this.addLine('╔════════════════════════════════╗', 'success');
                this.addLine('║  WELCOME BACK, OPERATOR        ║', 'success');
                this.addLine('║  NEXUS NODE STATUS: ONLINE     ║', 'success');
                this.addLine('╚════════════════════════════════╝', 'success');
                
                this.state.loggedIn = true;
                this.state.waitingForPassword = false;
                
                await this.sleep(500);
                this.resetLogin();
            },

            resetLogin() {
                this.state.waitingForLogin = false;
                this.state.waitingForPassword = false;
                this.input.placeholder = 'Enter command...';
                this.updatePrompt();
                this.input.focus();
            },

            async executeCommand(command) {
                const cmd = command.toLowerCase().trim();
                const parts = cmd.split(/\s+/);
                const baseCmd = parts[0];
                const args = parts.slice(1).join(' ');
                
                if (!command) return;

                this.addLine(`${this.state.currentUser || 'root'}@nexus:${this.state.currentPath} $ ${command}`, 'info');

                if (!this.state.booted) {
                    this.addLine('System still booting...', 'error');
                    return;
                }

                switch (baseCmd) {
                    case 'help':
                        this.showHelp();
                        break;
                    case 'ls':
                        this.listDirectory(args || '');
                        break;
                    case 'cd':
                        this.changeDirectory(args);
                        break;
                    case 'cat':
                    case 'open':
                        await this.readFile(args);
                        break;
                    case 'login':
                    case 'su':
                        await this.initiateLogin();
                        break;
                    case 'list':
                        this.listFiles();
                        break;
                    case 'clear':
                    case 'cls':
                        this.clear();
                        break;
                    case 'whoami':
                        if (this.state.loggedIn) {
                            this.addLine(this.state.currentUser, 'success');
                        } else {
                            this.addLine('not logged in', 'error');
                        }
                        break;
                    case 'pwd':
                        this.addLine(this.state.currentPath, 'info');
                        break;
                    case 'status':
                        this.showStatus();
                        break;
                    default:
                        this.addLine(`${baseCmd}: command not found`, 'error');
                }

                this.scrollToBottom();
            },

            showStatus() {
                const status = `
SYSTEM STATUS:

  Boot Status        :: COMPLETE
  Recovery Mode      :: ACTIVE
  Files Detected     :: 7
  Current Directory  :: ${this.state.currentPath}
  Authentication     :: ${this.state.loggedIn ? 'VERIFIED' : 'PENDING'}
  Session User       :: ${this.state.currentUser || 'anonymous'}
  Session Status     :: ${this.state.loggedIn ? 'ACTIVE' : 'INACTIVE'}
  Memory Usage       :: 45%
  CPU Load          :: 12%
  
Uptime: 0h 2m 34s
`;
                this.addLine(status.trim(), 'info');
            },

            clear() {
                this.output.innerHTML = '';
            },

            addLine(text, type = 'info') {
                const line = document.createElement('div');
                line.className = `line log-${type}`;
                
                const lineCount = this.output.children.length;
                line.style.animationDelay = `${lineCount * 0.02}s`;
                
                line.textContent = text;
                this.output.appendChild(line);
            },

            scrollToBottom() {
                this.output.scrollTop = this.output.scrollHeight;
            },

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        };

        terminal.init();
    </script>
</body>
